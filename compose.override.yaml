# Development environment override
services:
  php:
    build:
      context: .
      target: frankenphp_dev
    volumes:
      - ./:/app
      - ./frankenphp/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
      # If you develop on Mac or Windows you can remove the vendor/ directory
      #  from the bind-mount for better performance by enabling the next line:
      #- /app/vendor
    ports:
      - "127.0.0.1:80:80"
    environment:
      MERCURE_EXTRA_DIRECTIVES: demo
      # See https://xdebug.org/docs/all_settings#mode
      XDEBUG_MODE: "${XDEBUG_MODE:-off}"
    extra_hosts:
      # Ensure that host.docker.internal is correctly defined on Linux
      - host.docker.internal:host-gateway
    tty: true

###> symfony/mercure-bundle ###
###< symfony/mercure-bundle ###

###> doctrine/doctrine-bundle ###
  database:
    # Accès dev à la base restreint à la loopback (jamais 0.0.0.0).
    # Depuis le poste local : ssh -L 3306:127.0.0.1:3306 -p 49603 user@host
    ports:
      - "127.0.0.1:3306:3306"
###< doctrine/doctrine-bundle ###

###> symfony/mailer ###
  mailer:
    image: axllent/mailpit
    networks:
      - proxy
    # Restreint à la loopback : l'UI Mailpit (8025) et le SMTP (1025) ne doivent
    # pas être exposés publiquement. Accès via tunnel SSH :
    #   ssh -L 8025:127.0.0.1:8025 -p 49603 user@host
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
###< symfony/mailer ###

###> messenger & scheduler workers ###
  messenger-worker:
    volumes:
      - ./:/app
    environment:
      APP_ENV: dev

  scheduler-worker:
    volumes:
      - ./:/app
    environment:
      APP_ENV: dev
###< messenger & scheduler workers ###

networks:
  proxy:
    external: true
