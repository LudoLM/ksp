services:
  php:
    networks:
      - proxy
    image: ${IMAGES_PREFIX:-}app-php
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}, php:80
      APP_ENV: ${APP_ENV}
      MERCURE_PUBLISHER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET}
      MERCURE_SUBSCRIBER_JWT_KEY: ${CADDY_MERCURE_JWT_SECRET}
      # Run "composer require symfony/orm-pack" to install and configure Doctrine ORM
      DATABASE_URL: ${DATABASE_URL}
      # Run "composer require symfony/mercure-bundle" to install and configure the Mercure integration
      MERCURE_URL: ${CADDY_MERCURE_URL:-http://php/.well-known/mercure}
      MERCURE_PUBLIC_URL: ${CADDY_MERCURE_PUBLIC_URL:-https://${SERVER_NAME:-localhost}/.well-known/mercure}
      MERCURE_JWT_SECRET: ${CADDY_MERCURE_JWT_SECRET}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ${CADDY_CONF_DIR:-/home/debian/projets/caddy}:/etc/caddy/conf.d
    ports:
      # HTTP
      - target: 80
        published: ${HTTP_PORT:-8080}
        protocol: tcp
     
  # Mercure is installed as a Caddy module, prevent the Flex recipe from installing another service
  ###> symfony/mercure-bundle ###
  ###< symfony/mercure-bundle ###

  database:
    networks:
      - proxy
    container_name: database
    image: mysql:latest
    command: --max_allowed_packet=32505856
    ports:
      - "3306:3306"
    restart: always
    environment:
      MYSQL_DATABASE: 'db'
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql

  redis:
    networks:
      - proxy
    container_name: redis
    image: redis:alpine3.22
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  messenger-worker:
    networks:
      - proxy
    image: ${IMAGES_PREFIX:-}app-php
    entrypoint: []
    command: php /app/bin/console messenger:consume async --time-limit=3600 ${LOG_LEVEL:--vv}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      MAILER_DSN: ${MAILER_DSN}
    depends_on:
      - database
    healthcheck:
      test: ["CMD", "pgrep", "-f", "messenger:consume"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  scheduler-worker:
    networks:
      - proxy
    image: ${IMAGES_PREFIX:-}app-php
    entrypoint: []
    command: php /app/bin/console messenger:consume scheduler_default --time-limit=3600 ${LOG_LEVEL:--vv}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      MAILER_DSN: ${MAILER_DSN}
    depends_on:
      - database
    healthcheck:
      test: ["CMD", "pgrep", "-f", "messenger:consume"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ###> doctrine/doctrine-bundle ###
  #  database:
  #    image: postgres:${POSTGRES_VERSION:-16}-alpine
  #    environment:
  #      POSTGRES_DB: ${POSTGRES_DB:-app}
  #      # You should definitely change the password in production
  #      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
  #      POSTGRES_USER: ${POSTGRES_USER:-app}
  #    volumes:
  #      - database_data:/var/lib/postgresql/data:rw
  #      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
  #      # - ./docker/db/data:/var/lib/postgresql/data:rw
  ###< doctrine/doctrine-bundle ###

volumes:
  caddy_data:
  caddy_config:
  ###> symfony/mercure-bundle ###
  ###< symfony/mercure-bundle ###

  ###> doctrine/doctrine-bundle ###
  db-data:
  ###< doctrine/doctrine-bundle ###
  redis-data:

networks:
  proxy:
    external: true
